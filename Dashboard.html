  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">

  <!-- Custom CSS -->
  <style>

    /* Transisi Sidebar */
    #header {
      transition: all 0.4s ease;
    }

    .main,
    #footer {
      transition: all 0.4s ease;
    }

    /* Tombol Hamburger */
    .toggle-sidebar {
      position: fixed;
      top: 25px;
      left: 260px;
      z-index: 10000;

      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;
      color: white;

      font-size: 32px;
      cursor: pointer;

      transition: all 0.4s ease;
    }

    .toggle-sidebar:hover {
      color: #ff6600;
    }

    /* Sidebar disembunyikan */
    @media (min-width: 1200px) {

      body.sidebar-hidden #header {
        transform: translateX(-100%);
      }

      body.sidebar-hidden .main,
      body.sidebar-hidden #footer {
        margin-left: 0;
      }

      body.sidebar-hidden .toggle-sidebar {
        left: 15px;
        color: #333;
      }

      body.sidebar-hidden .toggle-sidebar:hover {
        color: #ff6600;
      }

    }

    /* Power BI Responsive */
    .powerbi-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .powerbi-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

  </style>

</head>

    document.addEventListener("DOMContentLoaded", function () {

      const toggleButton = document.getElementById("toggleSidebar");
